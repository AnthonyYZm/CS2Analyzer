[project]
name = "roundlens-workspace"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["roundlens-analyzer"]

[tool.uv.sources]
roundlens-analyzer = { workspace = true }

[tool.uv.workspace]
members = ["services/analyzer"]

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pyinstaller>=6.14,<7",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.13",
]

[tool.pytest.ini_options]
testpaths = ["services/analyzer/tests", "tests/integration"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "packages/contracts/generated-python",
  "services/analyzer/build",
  "services/analyzer/dist",
  "apps/desktop/src-tauri/binaries",
  "apps/desktop/src-tauri/target",
  ".tooling",
  ".packaging-smoke-data",
  ".test-data-health",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["roundlens_analyzer"]
mypy_path = "services/analyzer/src"
warn_unused_ignores = true
