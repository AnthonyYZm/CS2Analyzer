[project]
name = "roundlens-analyzer"
version = "0.1.0"
description = "RoundLens local CS2 demo analyzer sidecar"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.16,<2",
  "awpy>=2.0,<3",
  "demoparser2>=0.40,<1",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "platformdirs>=4.3,<5",
  "polars>=1.31,<2",
  "pyarrow>=20,<21",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
roundlens-analyzer = "roundlens_analyzer.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roundlens_analyzer"]

[tool.uv]
package = true

